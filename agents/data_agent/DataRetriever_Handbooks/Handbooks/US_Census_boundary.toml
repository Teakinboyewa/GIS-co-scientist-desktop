code_example = '''
import geopandas as gpd

def download_data():
    year   = 2019
    extend = 'us'
    level  = 'county'

    url = f'https://www2.census.gov/geo/tiger/GENZ{year}/shp/cb_{year}_{extend}_{level}_500k.zip'

    # Download all US counties
    county_gdf = gpd.read_file(url)

    # Filter for Pennsylvania only (state FIPS = '42')
    pennsylvania_gdf = county_gdf[county_gdf['STATEFP'] == '42'].copy()
    print(f"Pennsylvania counties: {len(pennsylvania_gdf)}")
    print(pennsylvania_gdf[['STATEFP', 'COUNTYFP', 'NAME']].head())

    output_file = 'PA_County_Boundaries_2019.gpkg'
    pennsylvania_gdf.to_file(output_file, layer='CountyBoundaries', driver='GPKG')
    print(f"Saved to {output_file}")

download_data()
'''

