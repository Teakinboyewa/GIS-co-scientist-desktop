brief_description = '''
NASA FIRMS (Fire Information for Resource Management System) provides global satellite-detected ACTIVE FIRE / thermal hotspot points (latitude, longitude, acquisition date/time, brightness temperature, Fire Radiative Power (FRP), detection confidence, day/night). Sensors: MODIS (1km, since ~2000), VIIRS (375m, since ~2012), and Landsat. Available as near-real-time (NRT, within ~3 hours of overpass, roughly the last ~2 months) and quality-controlled standard-processing (SP, the longer historical archive). NOTE: these are thermal detections at the moment of satellite overpass, NOT mapped burned-area / fire scars — for burn extent/severity use a burned-area product instead. Requires a free FIRMS MAP_KEY.
