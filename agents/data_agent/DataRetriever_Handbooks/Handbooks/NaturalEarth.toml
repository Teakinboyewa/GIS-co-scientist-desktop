# The following code example replaces the placeholder "{code_example}" in the handbook.
code_example = '''
# Example: download Natural Earth 1:50m admin-0 country boundaries and save as GeoPackage.
import os
import io
import zipfile
import tempfile
import requests
import geopandas as gpd

def download_data():
    scale = "50m"               # one of "10m", "50m", "110m"
    category = "cultural"       # one of "cultural", "physical", "raster"
    name = "ne_50m_admin_0_countries"

    url = f"https://naciscdn.org/naturalearth/{scale}/{category}/{name}.zip"

    # Download the zipped shapefile bundle.
    response = requests.get(url, timeout=120)
    response.raise_for_status()

    # Extract to a temp directory and locate the .shp file.
    with tempfile.TemporaryDirectory() as tmpdir:
        with zipfile.ZipFile(io.BytesIO(response.content)) as zf:
            zf.extractall(tmpdir)

        shp_path = None
        for root, _dirs, files in os.walk(tmpdir):
            for f in files:
                if f.lower().endswith(".shp"):
                    shp_path = os.path.join(root, f)
                    break
            if shp_path:
                break

        if shp_path is None:
            raise FileNotFoundError(f"No .shp file found inside {url}")

        gdf = gpd.read_file(shp_path)

    # Natural Earth data is in EPSG:4326 (WGS84).
    if gdf.crs is None:
        gdf.set_crs("EPSG:4326", inplace=True)

    output_file = "NaturalEarth_countries_50m.gpkg"
    gdf.to_file(output_file, layer=name, driver="GPKG")

download_data()
'''

