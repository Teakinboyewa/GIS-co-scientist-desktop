brief_description = '''
FEMA National Flood Hazard Layer (NFHL) provides the official US regulatory flood map data via ArcGIS REST API: flood hazard zones (100-year / 1% annual chance Special Flood Hazard Areas such as A, AE, AH, AO, V, VE; 0.2% annual chance zone X; etc.), base flood elevations, FIRM panels, levees, and related effective floodplain features. No API key required. Coverage is the United States and territories, but ONLY where effective digital flood maps (DFIRMs) exist — unmapped communities return no features. It reflects the current effective maps, not a historical time series.
